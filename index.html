<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10132f">
  <title>Saludos desde el espacio</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      background: #10132f;
      color: #fff9e8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 110%, #4b2777 0, transparent 48%),
        radial-gradient(ellipse at 12% 20%, #28265a 0, transparent 38%),
        #10132f;
    }

    .sky {
      position: relative;
      display: grid;
      min-height: 100vh;
      place-items: center;
      isolation: isolate;
      overflow: hidden;
    }

    main {
      position: static;
      width: 100%;
      height: 100vh;
      padding: 0;
      pointer-events: none;
    }

    .stars {
      position: absolute;
      inset: 0;
      z-index: -1;
      background-image:
        radial-gradient(2px 2px at 8% 18%, #fff 98%, transparent),
        radial-gradient(1.5px 1.5px at 19% 73%, #ffe994 98%, transparent),
        radial-gradient(2px 2px at 31% 29%, #fff 98%, transparent),
        radial-gradient(1px 1px at 43% 13%, #fff 98%, transparent),
        radial-gradient(2px 2px at 57% 77%, #ffe994 98%, transparent),
        radial-gradient(1.5px 1.5px at 69% 23%, #fff 98%, transparent),
        radial-gradient(2px 2px at 82% 61%, #fff 98%, transparent),
        radial-gradient(1px 1px at 93% 34%, #ffe994 98%, transparent),
        radial-gradient(1px 1px at 76% 88%, #fff 98%, transparent);
      background-size: 390px 340px;
      opacity: .8;
    }

    .planet {
      position: absolute;
      z-index: -1;
      right: -9rem;
      bottom: -19rem;
      width: min(70vw, 710px);
      aspect-ratio: 1;
      border: 1px solid rgb(255 255 255 / 24%);
      border-radius: 50%;
      background: linear-gradient(145deg, #f8a86c 0%, #d65c89 43%, #542d82 85%);
      box-shadow: inset 28px 25px 80px rgb(255 224 174 / 30%), 0 0 90px rgb(219 99 180 / 22%);
    }

    .crew {
      position: fixed;
      z-index: 2;
      inset: 0;
      pointer-events: none;
    }

    .frog {
      position: absolute;
      top: 50%;
      left: 50%;
      display: block;
      width: clamp(130px, 26vw, 205px);
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
      filter: drop-shadow(0 16px 16px rgb(4 4 22 / 35%));
      translate: -50% -50%;
      transition: left 2.4s ease-in-out, top 2.4s ease-in-out;
      animation: bob 3.2s ease-in-out infinite;
      pointer-events: auto;
      -webkit-tap-highlight-color: transparent;
    }

    .frog svg {
      display: block;
      width: 100%;
      height: auto;
    }

    .frog:focus-visible {
      outline: 3px solid #fff1a8;
      outline-offset: 6px;
      border-radius: 45%;
    }

    .frog:disabled {
      cursor: default;
    }

    .frog:nth-child(2) {
      width: clamp(150px, 31vw, 245px);
    }

    .ufo {
      position: absolute;
      z-index: 3;
      top: 16%;
      right: 12%;
      width: clamp(92px, 15vw, 145px);
      padding: 0;
      border: 0;
      background: transparent;
      filter: drop-shadow(0 0 18px rgb(120 255 212 / 35%));
      animation: drift 6s ease-in-out infinite;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .ufo svg {
      display: block;
      width: 100%;
      height: auto;
    }

    .ufo:focus-visible,
    .return-button:focus-visible {
      outline: 3px solid #fff1a8;
      outline-offset: 6px;
      border-radius: 50%;
    }

    .ufo:disabled {
      cursor: default;
    }

    .ufo-left {
      top: 32%;
      right: auto;
      left: 8%;
      width: clamp(65px, 10vw, 92px);
      animation-delay: -3s;
      opacity: .8;
    }

    .game-over {
      position: fixed;
      z-index: 10;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      background: #080711;
      color: #fff9e8;
    }

    .game-over[hidden] {
      display: none;
    }

    .game-over h1 {
      margin: 0;
      font-size: clamp(3rem, 12vw, 7rem);
      letter-spacing: .06em;
      text-shadow: 0 0 28px rgb(255 104 126 / 60%);
    }

    .return-button {
      display: grid;
      width: 64px;
      height: 64px;
      place-items: center;
      padding: 0;
      border: 2px solid #a9f4d0;
      border-radius: 50%;
      background: transparent;
      color: #a9f4d0;
      cursor: pointer;
      transition: background-color 180ms ease, color 180ms ease, transform 180ms ease;
    }

    .return-button:hover {
      transform: rotate(-35deg);
      background: #a9f4d0;
      color: #10132f;
    }

    .return-button svg {
      width: 34px;
      height: 34px;
    }

    .shatter-overlay,
    .bang-overlay,
    .laser-overlay {
      position: fixed;
      z-index: 5;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .laser-overlay {
      z-index: 8;
      background: transparent;
      animation: blackout-fade 800ms ease-in 450ms forwards;
    }

    .laser-beam {
      position: absolute;
      top: var(--start-y);
      left: var(--start-x);
      width: var(--beam-length);
      height: clamp(5px, .7vw, 10px);
      border-radius: 50%;
      background: linear-gradient(to bottom, transparent, #fff 30%, #a9f4ff 50%, #56e6ff 70%, transparent);
      box-shadow: 0 0 12px 4px #51e4ff, 0 0 32px 10px #50aeff;
      transform: rotate(var(--beam-angle)) scaleX(0);
      transform-origin: left center;
      animation: laser-shot 420ms ease-out forwards;
    }

    .shatter-overlay {
      display: grid;
      grid-template-columns: repeat(var(--columns), 1fr);
      grid-template-rows: repeat(var(--rows), 1fr);
    }

    .shard {
      animation: shatter 950ms cubic-bezier(.45, 0, .9, .4) forwards;
      background: var(--shard-color);
      border: 1px solid rgb(255 255 255 / 8%);
    }

    .bang-overlay {
      background: radial-gradient(circle at var(--origin-x) var(--origin-y), #fffce5 0, #ffc970 3%, #fa754f 9%, #9f45d0 22%, #241b55 52%, #10132f 78%);
      animation: bang-fade 1500ms ease-in forwards;
    }

    .bang-ring {
      position: absolute;
      top: var(--origin-y);
      left: var(--origin-x);
      width: 5vmin;
      aspect-ratio: 1;
      border: 3px solid rgb(255 250 210 / 90%);
      border-radius: 50%;
      box-shadow: 0 0 35px 8px rgb(255 189 111 / 70%), inset 0 0 20px rgb(255 255 255 / 60%);
      transform: translate(-50%, -50%);
      animation: bang-ring 1100ms cubic-bezier(.1, .6, .3, 1) forwards;
    }

    .bang-particle {
      position: absolute;
      top: var(--origin-y);
      left: var(--origin-x);
      width: var(--size);
      aspect-ratio: 1;
      border-radius: 50%;
      background: var(--particle-color);
      box-shadow: 0 0 12px 3px var(--particle-color);
      animation: bang-particle 1100ms ease-out forwards;
    }

    .vanished {
      background: #080b1b;
    }

    .vanished .sky {
      display: none;
    }

    .blackout {
      background: #000;
    }

    .blackout .sky {
      display: none;
    }

    @keyframes bob {
      0%, 100% { transform: translateY(0) rotate(-2deg); }
      50% { transform: translateY(-12px) rotate(2deg); }
    }

    @keyframes drift {
      0%, 100% { transform: translate(0, 0) rotate(-5deg); }
      50% { transform: translate(12px, -10px) rotate(4deg); }
    }

    @keyframes shatter {
      0% { opacity: 1; transform: translate(0, 0) rotate(0) scale(1); }
      100% { opacity: 0; transform: translate(var(--dx), var(--dy)) rotate(var(--rotation)) scale(.15); }
    }

    @keyframes bang-ring {
      0% { opacity: .95; width: 5vmin; }
      100% { opacity: 0; width: 180vmax; }
    }

    @keyframes bang-particle {
      0% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(0); }
    }

    @keyframes bang-fade {
      0%, 65% { opacity: 1; }
      100% { opacity: 0; }
    }

    @keyframes laser-shot {
      0% { transform: rotate(var(--beam-angle)) scaleX(0); }
      75% { transform: rotate(var(--beam-angle)) scaleX(1.05); }
      100% { transform: rotate(var(--beam-angle)) scaleX(1); }
    }

    @keyframes blackout-fade {
      to { background: #000; }
    }

    @media (max-width: 520px) {
      body, .sky { min-height: 100svh; }
      .frog { width: 31vw; }
      .frog:nth-child(2) { width: 36vw; }
      .ufo { top: 9%; right: 8%; }
      .ufo-left { top: 23%; left: 5%; }
      .planet { right: -45%; bottom: -10rem; width: 110vw; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }

      .frog,
      .return-button {
        transition-duration: .01ms;
      }
    }
  </style>
</head>

  <script>
    const frogs = [...document.querySelectorAll(".frog")];
    const ships = [...document.querySelectorAll(".ufo")];
    const movementTimers = [];
    const outcomes = ["wikipedia", "shatter", "big-bang"];

    for (let index = outcomes.length - 1; index > 0; index--) {
      const swapIndex = Math.floor(Math.random() * (index + 1));
      [outcomes[index], outcomes[swapIndex]] = [outcomes[swapIndex], outcomes[index]];
    }

    function stopGame() {
      [...frogs, ...ships].forEach((frog) => {
        frog.disabled = true;
      });
      movementTimers.forEach((timer) => {
        window.clearInterval(timer);
      });
    }

    function moveFrog(frog) {
      const bounds = frog.getBoundingClientRect();
      const halfWidth = bounds.width / 2;
      const halfHeight = bounds.height / 2;
      const minX = halfWidth + 8;
      const maxX = Math.max(minX, window.innerWidth - halfWidth - 8);
      const minY = Math.max(halfHeight + 8, window.innerHeight * .15);
      const maxY = Math.max(minY, window.innerHeight - halfHeight - 8);
      const otherFrogs = frogs.filter((other) => other !== frog);
      let x = minX;
      let y = minY;

      for (let attempt = 0; attempt < 24; attempt++) {
        x = minX + Math.random() * (maxX - minX);
        y = minY + Math.random() * (maxY - minY);
        const separated = otherFrogs.every((other) => {
          const otherBounds = other.getBoundingClientRect();
          const otherX = Number.parseFloat(other.style.left);
          const otherY = Number.parseFloat(other.style.top);
          const distanceX = (bounds.width + otherBounds.width) * .38;
          const distanceY = (bounds.height + otherBounds.height) * .38;
          return Math.hypot((x - otherX) / distanceX, (y - otherY) / distanceY) > 1;
        });

        if (separated) {
          break;
        }
      }

      frog.style.left = `${x}px`;
      frog.style.top = `${y}px`;
    }

    function vanishAfter(overlay, delay) {
      window.setTimeout(() => {
        document.querySelector(".sky").remove();
        overlay.remove();
        document.querySelector(".game-over").hidden = false;
      }, delay);
    }

    function shatterPage() {
      stopGame();
      const overlay = document.createElement("div");
      const columns = Math.ceil(window.innerWidth / 64);
      const rows = Math.ceil(window.innerHeight / 64);
      const colors = ["#10132f", "#28265a", "#4b2777", "#d65c89", "#f8a86c", "#80e59a", "#73dc91", "#83d8c0"];
      overlay.className = "shatter-overlay";
      overlay.setAttribute("aria-hidden", "true");
      overlay.style.setProperty("--columns", columns);
      overlay.style.setProperty("--rows", rows);

      for (let row = 0; row < rows; row++) {
        for (let column = 0; column < columns; column++) {
          const shard = document.createElement("div");
          const x = (column + .5) / columns;
          const y = (row + .5) / rows;
          let palette;

          if (y > .55 && x > .45) {
            palette = colors.slice(3, 5);
          } else if (y > .5 && x > .15 && x < .85) {
            palette = colors.slice(5, 7);
          } else if (y < .42 && (x < .18 || x > .78)) {
            palette = colors.slice(6, 8);
          } else {
            palette = colors.slice(0, 3);
          }

          shard.className = "shard";
          shard.style.setProperty("--shard-color", palette[Math.floor(Math.random() * palette.length)]);
          shard.style.setProperty("--dx", `${(Math.random() - .5) * 260}px`);
          shard.style.setProperty("--dy", `${(Math.random() - .5) * 260}px`);
          shard.style.setProperty("--rotation", `${(Math.random() - .5) * 100}deg`);
          overlay.append(shard);
        }
      }

      document.body.append(overlay);
      document.querySelector(".sky").animate([{ opacity: 1 }, { opacity: 0 }], { duration: 700, fill: "forwards" });
      vanishAfter(overlay, 1000);
    }

    function createBigBang(frog) {
      stopGame();
      const overlay = document.createElement("div");
      const bounds = frog.getBoundingClientRect();
      const originX = `${bounds.left + bounds.width / 2}px`;
      const originY = `${bounds.top + bounds.height / 2}px`;
      const colors = ["#fffce5", "#ffda76", "#ff9466", "#a9f4d0", "#d7b6ff"];

      overlay.className = "bang-overlay";
      overlay.setAttribute("aria-hidden", "true");
      overlay.style.setProperty("--origin-x", originX);
      overlay.style.setProperty("--origin-y", originY);

      const ring = document.createElement("div");
      ring.className = "bang-ring";
      overlay.append(ring);

      for (let index = 0; index < 90; index++) {
        const particle = document.createElement("div");
        const angle = Math.random() * Math.PI * 2;
        const distance = Math.max(window.innerWidth, window.innerHeight) * (.35 + Math.random() * .8);
        particle.className = "bang-particle";
        particle.style.setProperty("--dx", `${Math.cos(angle) * distance}px`);
        particle.style.setProperty("--dy", `${Math.sin(angle) * distance}px`);
        particle.style.setProperty("--size", `${3 + Math.random() * 8}px`);
        particle.style.setProperty("--particle-color", colors[Math.floor(Math.random() * colors.length)]);
        overlay.append(particle);
      }

      document.body.append(overlay);
      vanishAfter(overlay, 1550);
    }

    function attackWithLaser(ship) {
      stopGame();
      const target = frogs[Math.floor(Math.random() * frogs.length)];
      const shipBounds = ship.getBoundingClientRect();
      const targetBounds = target.getBoundingClientRect();
      const startX = shipBounds.left + shipBounds.width / 2;
      const startY = shipBounds.top + shipBounds.height / 2;
      const endX = targetBounds.left + targetBounds.width / 2;
      const endY = targetBounds.top + targetBounds.height / 2;
      const beam = document.createElement("div");
      const overlay = document.createElement("div");

      overlay.className = "laser-overlay";
      overlay.setAttribute("aria-hidden", "true");
      beam.className = "laser-beam";
      beam.style.setProperty("--start-x", `${startX}px`);
      beam.style.setProperty("--start-y", `${startY}px`);
      beam.style.setProperty("--beam-length", `${Math.hypot(endX - startX, endY - startY)}px`);
      beam.style.setProperty("--beam-angle", `${Math.atan2(endY - startY, endX - startX)}rad`);
      overlay.append(beam);
      document.body.append(overlay);

      window.setTimeout(() => {
        document.querySelector(".sky").remove();
        overlay.remove();
        document.body.classList.add("blackout");
      }, 1300);
    }

    frogs.forEach((frog, index) => {
      frog.dataset.outcome = outcomes[index];
      frog.addEventListener("click", () => {
        stopGame();
        if (frog.dataset.outcome === "wikipedia") {
          window.location.assign("https://es.wikipedia.org/wiki/Dendrobatidae");
        } else if (frog.dataset.outcome === "shatter") {
          shatterPage();
        } else {
          createBigBang(frog);
        }
      });
    });

    ships.forEach((ship) => {
      ship.addEventListener("click", attackWithLaser.bind(null, ship));
    });

    document.querySelector(".return-button").addEventListener("click", () => {
      window.location.reload();
    });

    frogs.forEach((frog, index) => {
      frog.style.transition = "none";
      frog.style.left = `${window.innerWidth * (index + 1) / (frogs.length + 1)}px`;
      frog.style.top = `${window.innerHeight * (index === 1 ? .58 : .7)}px`;
      window.requestAnimationFrame(() => {
        frog.style.removeProperty("transition");
      });

      const timer = window.setInterval(() => {
        moveFrog(frog);
      }, 2600 + index * 400 + Math.random() * 1300);
      movementTimers.push(timer);
    });

    window.addEventListener("resize", () => {
      frogs.forEach(moveFrog);
    });
  </script>
</body>
</html>
