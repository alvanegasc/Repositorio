<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10132f">
  <title>Saludos desde el espacio</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      background: #10132f;
      color: #fff9e8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 110%, #4b2777 0, transparent 48%),
        radial-gradient(ellipse at 12% 20%, #28265a 0, transparent 38%),
        #10132f;
    }

    .sky {
      position: relative;
      display: grid;
      min-height: 100vh;
      place-items: center;
      isolation: isolate;
      overflow: hidden;
    }

    .stars {
      position: absolute;
      inset: 0;
      z-index: -1;
      background-image:
        radial-gradient(2px 2px at 8% 18%, #fff 98%, transparent),
        radial-gradient(1.5px 1.5px at 19% 73%, #ffe994 98%, transparent),
        radial-gradient(2px 2px at 31% 29%, #fff 98%, transparent),
        radial-gradient(1px 1px at 43% 13%, #fff 98%, transparent),
        radial-gradient(2px 2px at 57% 77%, #ffe994 98%, transparent),
        radial-gradient(1.5px 1.5px at 69% 23%, #fff 98%, transparent),
        radial-gradient(2px 2px at 82% 61%, #fff 98%, transparent),
        radial-gradient(1px 1px at 93% 34%, #ffe994 98%, transparent),
        radial-gradient(1px 1px at 76% 88%, #fff 98%, transparent);
      background-size: 390px 340px;
      opacity: .8;
    }

    .planet {
      position: absolute;
      z-index: -1;
      right: -9rem;
      bottom: -19rem;
      width: min(70vw, 710px);
      aspect-ratio: 1;
      border: 1px solid rgb(255 255 255 / 24%);
      border-radius: 50%;
      background: linear-gradient(145deg, #f8a86c 0%, #d65c89 43%, #542d82 85%);
      box-shadow: inset 28px 25px 80px rgb(255 224 174 / 30%), 0 0 90px rgb(219 99 180 / 22%);
    }

    .planet::after {
      position: absolute;
      inset: 18% 0 auto;
      height: 9px;
      content: "";
      background: rgb(255 220 186 / 22%);
      transform: rotate(-17deg);
      box-shadow: 0 34px 0 rgb(255 220 186 / 14%), 0 68px 0 rgb(255 220 186 / 10%);
    }

    main {
      z-index: 1;
      width: min(100% - 2rem, 820px);
      padding: 3.5rem 1rem 2rem;
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 .85rem;
      color: #a9f4d0;
      font-size: .8rem;
      font-weight: 800;
      letter-spacing: .3em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: #fff7df;
      font-size: clamp(2.6rem, 8vw, 5.8rem);
      line-height: .98;
      letter-spacing: -.055em;
      text-shadow: 0 5px 25px rgb(10 10 30 / 35%);
    }

    h1 span {
      display: block;
      color: #a9f4d0;
    }

    .subtitle {
      margin: 1.25rem 0 0;
      color: #d7d2ef;
      font-size: clamp(1rem, 2.4vw, 1.2rem);
    }

    .crew {
      display: flex;
      align-items: end;
      justify-content: center;
      gap: clamp(.25rem, 3vw, 2rem);
      margin: 1.5rem auto 0;
    }

    .frog {
      width: clamp(130px, 26vw, 205px);
      height: auto;
      filter: drop-shadow(0 16px 16px rgb(4 4 22 / 35%));
      animation: bob 3.2s ease-in-out infinite;
    }

    .frog:nth-child(2) {
      width: clamp(150px, 31vw, 245px);
      animation-delay: -1.2s;
    }

    .frog:nth-child(3) {
      animation-delay: -2s;
    }

    .ufo {
      position: absolute;
      top: 16%;
      right: 12%;
      width: clamp(92px, 15vw, 145px);
      height: auto;
      filter: drop-shadow(0 0 18px rgb(120 255 212 / 35%));
      animation: drift 6s ease-in-out infinite;
    }

    .ufo-left {
      top: 32%;
      right: auto;
      left: 8%;
      width: clamp(65px, 10vw, 92px);
      animation-delay: -3s;
      opacity: .8;
    }

    @keyframes bob {
      0%, 100% { transform: translateY(0) rotate(-2deg); }
      50% { transform: translateY(-12px) rotate(2deg); }
    }

    @keyframes drift {
      0%, 100% { transform: translate(0, 0) rotate(-5deg); }
      50% { transform: translate(12px, -10px) rotate(4deg); }
    }

    @media (max-width: 520px) {
      body, .sky { min-height: 100svh; }
      main { padding-top: 4rem; }
      .crew { gap: 0; margin-top: 2rem; }
      .frog { width: 31vw; }
      .frog:nth-child(2) { width: 36vw; }
      .ufo { top: 9%; right: 8%; }
      .ufo-left { top: 23%; left: 5%; }
      .planet { right: -45%; bottom: -10rem; width: 110vw; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

</body>
